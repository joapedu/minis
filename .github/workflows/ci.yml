name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - name: Build workspace (release)
        run: cargo build --workspace --release

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk || true
      - name: Build Android (armeabi-v7a, arm64)
        run: |
          cargo ndk -t armeabi-v7a -t arm64-v8a -- build --release --manifest-path platform/android/Cargo.toml

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '7.4.0'
      - name: Build Android app (assembleDebug)
        run: |
          cd examples/android
          bash ./bootstrap-gradle-wrapper.sh || true
          ./gradlew assembleDebug || gradle assembleDebug || true
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: examples/android/app/build/outputs/apk/**/app-*.apk

  sign-apk:
    runs-on: ubuntu-latest
    needs: android-apk
    if: ${{ secrets.APK_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
      - name: Install build-tools (apksigner)
        run: |
          sudo apt-get update && sudo apt-get install -y apksigner || true
      - name: Sign APK
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          chmod +x tools/sign-apk.sh || true
          APK=$(ls examples/android/app/build/outputs/apk/**/app-*.apk | head -n1)
          ./tools/sign-apk.sh "$APK"

  macos-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - name: Build iOS staticlib (via cargo-lipo if available)
        run: |
          cargo install cargo-lipo || true
          cargo lipo --manifest-path platform/ios/Cargo.toml --release || true

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - name: Run release script
        run: |
          chmod +x tools/release.sh || true
          ./tools/release.sh
      - name: Run size check
        run: |
          chmod +x tools/size-check.sh || true
          ./tools/size-check.sh
      - name: Upload release artifacts
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  size-report:
    runs-on: ubuntu-latest
    needs: build-matrix
    steps:
      - uses: actions/checkout@v4
      - name: Run size check
        run: |
          chmod +x tools/size-check.sh || true
          ./tools/size-check.sh
      - name: Upload size report
        uses: actions/upload-artifact@v4
        with:
          name: size-report
          path: dist/size-report.txt
  sign-ipa:
    runs-on: macos-latest
    needs: macos-ios
    if: ${{ secrets.IOS_CERT_BASE64 && secrets.IOS_PROFILE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Run iOS sign prep
        env:
          IOS_CERT_BASE64: ${{ secrets.IOS_CERT_BASE64 }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          chmod +x tools/sign-ipa.sh || true
          ./tools/sign-ipa.sh
